[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"


[project]
name = "agentic-qa"
version = "0.1.0"
description = "Agentic QA automation system built with LangGraph, Playwright, and pytest"
readme = "README.md"
requires-python = ">=3.12,<3.13"

dependencies = [
    "langgraph>=1.2.11,<2.0",
    "langchain-openai>=1.6.0,<2.0",
    "pydantic>=2.13.5,<3.0",
    "pydantic-settings>=2.15.0,<3.0",
    "playwright>=1.62.0,<2.0",
]


[project.scripts]
agentic-qa = "agentic_qa.main:main"


[dependency-groups]
dev = [
    "pytest>=9.1.1,<10.0",
    "pytest-cov>=7.1.0,<8.0",
    "ruff>=0.16.4,<0.17",
    "mypy>=2.3.1,<3.0",
    "pytest-playwright>=0.9.0",
]


[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = [
    "-ra",
    "--strict-markers",
    "--strict-config",
]


[tool.ruff]
target-version = "py312"
line-length = 100
src = ["src", "tests"]


[tool.ruff.lint]
select = [
    "E",
    "F",
    "I",
    "UP",
    "B",
]
ignore = []


[tool.ruff.format]
quote-style = "double"
indent-style = "space"


[tool.mypy]
python_version = "3.12"
packages = ["agentic_qa"]
warn_return_any = true
warn_unused_configs = true
check_untyped_defs = true
disallow_untyped_defs = true
no_implicit_optional = true
